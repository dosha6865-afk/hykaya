const setV=()=>`<div class="c"><h3>الإعدادات</h3><input id="lo" placeholder="رابط اللوجو" value="${esc(S.logo)}"><textarea id="ga" rows="4" placeholder="روابط صور المكان (رابط في كل سطر)">${esc((S.gal||[]).join('\n'))}</textarea><input id="tg" placeholder="جملة تحت اللوجو" value="${esc(S.tag)}"><input id="fe" type="number" placeholder="سعر التوصيل الثابت (جنيه)" value="${S.fee??''}"><input id="pk" type="number" step="0.5" placeholder="سعر كل كيلو مسافة (جنيه)" value="${S.km??''}"><input id="fb" placeholder="رابط فيسبوك" value="${esc(S.fb)}"><input id="ig" placeholder="رابط انستجرام" value="${esc(S.ig)}"><input id="wa" placeholder="واتساب بالصيغة الدولية 201103008038" value="${esc(S.wa)}"><textarea id="br" rows="3" placeholder="الفروع: الاسم|رابط الخريطة|خط العرض,خط الطول (فرع في كل سطر)">${esc((S.br||[]).map(b=>b.n+'|'+b.u+'|'+(b.la!=null?b.la+','+b.lo:'')).join('\n'))}</textarea><button class="go" data-a="ss">حفظ</button></div>`;
function saveSet(){const g=id=>$('#'+id).value.trim();db.doc('settings/main').set({logo:g('lo'),gal:g('ga').split('\n').map(x=>x.trim()).filter(Boolean),tag:g('tg'),fee:+g('fe')||0,km:+g('pk')||0,fb:g('fb'),ig:g('ig'),wa:g('wa'),br:g('br').split('\n').filter(x=>x.includes('|')).map(l=>{const t=l.split('|'),c=(t[2]||'').split(',').map(Number),o={n:t[0].trim(),u:(t[1]||'').trim()};if(t[2]&&t[2].trim()&&c.length==2&&!c.some(isNaN)){o.la=c[0];o.lo=c[1]}return o})}).then(()=>alert('تم الحفظ ✅')).catch(e=>alert(e.message))}
document.onclick=e=>{if(e.target.id=='sh')sh(0);const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a=='new')form();else if(a=='edit')form(items.find(i=>i.id==t.dataset.id));else if(a=='add')$('#zs').insertAdjacentHTML('beforeend',row({}));else if(a=='rm')t.parentNode.remove();
 else if(a=='save')save();else if(a=='cls')sh(0);else if(a=='seed')seed();else if(a=='ss')saveSet();
 else if(a=='del'&&confirm('حذف الصنف نهائي؟'))db.doc('items/'+$('#pn').dataset.id).delete().then(()=>sh(0))};
document.oninput=e=>{const t=e.target;if(t.id=='iq'){iq=t.value.trim();$('#il').innerHTML=listV()}
 if(t.classList.contains('s'))t.parentNode.querySelectorAll('.t,.d').forEach(x=>{if(!x.dataset.m)x.value=t.value});else if(t.classList.contains('t')||t.classList.contains('d'))t.dataset.m=1};
document.onchange=e=>{const t=e.target;if(t.className!='st')return;const r=db.doc('orders/'+t.dataset.id);if(t.value=='done'||t.value=='x'){if(confirm('الطلب هيتمسح من السجل نهائيًا، متأكد؟'))r.delete();else show()}else r.update({st:t.value})};
