<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>كشري حكاية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0f38;--cd:#3b1850;--gr:#7ab51d;--or:#f59e0b;--mu:#d9c3e6}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:130px;scroll-behavior:smooth}
body{background:var(--bg);color:#fff;font-family:Cairo,Tahoma,sans-serif;max-width:640px;margin:auto;padding-bottom:80px}
button,input,textarea{font:700 14px Cairo,sans-serif}
header{text-align:center;padding:16px 14px 6px;background:linear-gradient(160deg,#4d1a66,var(--bg))}header h1{font-size:28px}header img{width:120px}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 14px}.gal img{flex:none;width:80%;height:170px;object-fit:cover;border-radius:16px;scroll-snap-align:center}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 10px;border-bottom:1px solid #fff2}
.md{display:flex;gap:6px}.md button{flex:1;border:0;border-radius:12px;padding:9px 2px;background:#4a2262;color:var(--mu)}.md .on{background:var(--gr);color:#1b2a05}
.q,.f{width:100%;border:0;border-radius:10px;padding:10px;margin-top:8px;background:var(--cd);color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-top:8px;scrollbar-width:none}.tabs a{flex:none;padding:5px 13px;border-radius:20px;background:#4a2262;color:var(--mu);text-decoration:none;font-size:13px}
h2{font-size:19px;margin:20px 14px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.it{background:var(--cd);border-radius:16px;overflow:hidden;cursor:pointer}
.ph{aspect-ratio:4/3;background:#6b2a87;display:flex;align-items:center;justify-content:center;font-size:44px}.ph img{width:100%;height:100%;object-fit:cover}
.i{padding:9px 10px}.i b{font-size:14px}.pr{color:var(--or);font-weight:900;margin-top:4px}
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none}
.fc{flex:none;width:200px;height:230px;position:relative}.fc img,.fc .fe{width:100%;height:100%;object-fit:cover}.fc .fe{display:flex;align-items:center;justify-content:center;font-size:56px;background:#6b2a87}
.fl{position:absolute;inset:auto 0 0 0;padding:30px 10px 10px;background:linear-gradient(transparent,#1d0829ee)}.fl b{display:block;font-size:15px}.fl span{color:var(--or);font-weight:900}
.pi{width:100%;height:240px;object-fit:cover;border-radius:16px;margin-bottom:12px;background:#6b2a87}
.sh{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}
.pn{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px}
.op{display:flex;justify-content:space-between;width:100%;border:2px solid #fff3;background:var(--cd);color:#fff;border-radius:12px;padding:10px;margin-top:8px}.op.on{border-color:var(--or)}
.go{width:100%;border:0;border-radius:14px;padding:13px;margin-top:14px;background:var(--gr);color:#16260a;font-size:16px;font-weight:900}
.cart{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:616px;z-index:30;display:none}.cart .go{margin:0}
.r{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #fff2}.r button{width:30px;height:30px;border:0;border-radius:50%;background:var(--or)}
footer{text-align:center;color:var(--mu);font-size:13px;padding:24px 14px}footer a{color:var(--or);margin:0 6px}
</style></head><body>
<header id="hd"><h1>كشري حكاية</h1></header><div class="gal" id="gal"></div>
<div class="bar"><div class="md" id="md"></div><input class="q" id="q" placeholder="🔍 دوّر على صنف..."><nav class="tabs" id="tb"></nav></div>
<main id="mn"></main><footer id="ft"></footer>
<div class="cart" id="ct"><button class="go" id="cb"></button></div>
<div class="sh" id="sh"><div class="pn" id="pn"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyBVo7lZD7wA0ZiyonjFDJ02oI7vtFL6PL8",authDomain:"hekayah-2b746.firebaseapp.com",projectId:"hekayah-2b746",appId:"1:835699402304:web:fc3ec2a7b09fe3029f61a5"};
firebase.initializeApp(FB);const db=firebase.firestore();
// قيم افتراضية (بتتعدل من لوحة الإدارة > الإعدادات)
const DEF={fb:"https://www.facebook.com/share/1YafafjWqT/",ig:"https://www.instagram.com/hekaya_koshary?srtk=MWN4N2J3a2N5eHhkbw==",wa:"201103008038",fee:0,
br:[{n:"فرع ميدان الساعة",u:"https://maps.app.goo.gl/3YRHpijEeg6H73Rc9?g_st=ac"},{n:"فرع 45",u:"https://maps.app.goo.gl/XGmzqW8zqPxJu1M2A?g_st=ac"}]};
</script>
<script>
const $=s=>document.querySelector(s),$d=$,M={s:'🍽️ الصالة',t:'🛍️ تيك أواي',d:'🛵 توصيل'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mode=localStorage.m||'s',items=[],S=DEF,cart=[],q='';
const price=o=>o[mode]===''||o[mode]==null?null:+o[mode],opts=i=>(i.z||[]).filter(o=>price(o)!=null);
const tot=()=>cart.reduce((a,c)=>a+c.p*c.q,0),fee=()=>mode=='d'?+(S.fee||0):0,sh=on=>$('#sh').classList.toggle('on',!!on);
Promise.all([db.collection('items').get(),db.doc('settings/main').get()]).then(([a,b])=>{
 items=a.docs.map(d=>({id:d.id,...d.data()})).filter(i=>!i.h).sort((x,y)=>x.o-y.o);S={...DEF,...(b.data()||{})};head();render()
}).catch(()=>$('#mn').innerHTML='<p style="padding:40px;text-align:center">تعذر تحميل المنيو، حاول تاني</p>');
function head(){let h='';if(S.logo)h+=`<img src="${esc(S.logo)}" alt="">`;else h+='<h1>كشري حكاية</h1>';if(S.tag)h+=`<p style="color:var(--mu)">${esc(S.tag)}</p>`;$('#hd').innerHTML=h;
 $('#gal').innerHTML=(S.gal||[]).map(u=>`<img src="${esc(u)}" loading="lazy" alt="">`).join('');
 $('#ft').innerHTML=`<div>${(S.br||[]).map(b=>`<a href="${esc(b.u)}" target="_blank">📍 ${esc(b.n)}</a>`).join('')}</div><div style="margin:12px 0"><a href="${esc(S.fb)}" target="_blank">فيسبوك</a><a href="${esc(S.ig)}" target="_blank">انستجرام</a><a href="https://wa.me/${esc(S.wa)}" target="_blank">واتساب</a></div>الأسعار بالجنيه المصري`}
$('#md').innerHTML=Object.entries(M).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('');
$('#md').onclick=e=>{const k=e.target.dataset.k;if(k&&k!=mode){if(cart.length&&!confirm('تغيير القسم هيفضّي السلة، متأكد؟'))return;mode=k;localStorage.m=k;cart=[];render()}};
$('#q').oninput=e=>{q=e.target.value.trim();render()};
$('#sh').onclick=e=>{if(e.target.id=='sh')sh(0)};
function render(){document.querySelectorAll('#md button').forEach(b=>b.classList.toggle('on',b.dataset.k==mode));
 const cats=[],by={};items.forEach(i=>{if(!opts(i).length||(q&&!i.n.includes(q)))return;(by[i.c]=by[i.c]||(cats.push(i.c),[])).push(i)});
 $('#tb').innerHTML=cats.map((c,k)=>`<a href="#c${k}">${esc(c)}</a>`).join('');
 const F=q?[]:items.filter(i=>i.f&&opts(i).length),fh=F.length?`<h2>🔥 الأصناف المميزة</h2><div class="feat">${F.map(i=>{const p=opts(i).map(price);return `<div class="it fc" data-id="${i.id}">${i.im?`<img src="${esc(i.im)}" loading="lazy" alt="">`:`<div class="fe">${esc(i.c.split(' ')[0])}</div>`}<div class="fl"><b>${esc(i.n)}</b><span>${p.length>1?'من ':''}${Math.min(...p)} ج</span></div></div>`}).join('')}</div>`:'';
 $('#mn').innerHTML=fh+cats.map((c,k)=>`<section id="c${k}"><h2>${esc(c)}</h2><div class="grid">${by[c].map(i=>{const p=opts(i).map(price);return `<div class="it" data-id="${i.id}"><div class="ph">${i.im?`<img src="${esc(i.im)}" loading="lazy" alt="">`:esc(c.split(' ')[0])}</div><div class="i"><b>${esc(i.n)}</b><div class="pr">${p.length>1?'من ':''}${Math.min(...p)} ج</div></div></div>`}).join('')}</div></section>`).join('')||'<p style="text-align:center;padding:40px">مفيش نتائج 🙈</p>';cartbar()}
$('#mn').onclick=e=>{const c=e.target.closest('.it');if(c)open(items.find(i=>i.id==c.dataset.id))};
function open(i){let k=0;const o=opts(i),P=$('#pn'),d=()=>{P.innerHTML=`${i.im?`<img class="pi" src="${esc(i.im)}" alt="">`:''}<h3>${esc(i.n)}</h3>${i.d?`<p style="color:var(--mu);margin-top:6px">${esc(i.d)}</p>`:''}${o.map((x,j)=>`<button class="op ${j==k?'on':''}" data-j="${j}"><span>${esc(x.l)||'السعر'}</span><b>${price(x)} ج</b></button>`).join('')}${mode!='s'?`<button class="go" id="add">أضف للسلة • ${price(o[k])} ج</button>`:''}`;
 P.querySelectorAll('.op').forEach(b=>b.onclick=()=>{k=+b.dataset.j;d()});const a=$('#add');if(a)a.onclick=()=>{const x=o[k],id=i.id+x.l,f=cart.find(c=>c.k==id);f?f.q++:cart.push({k:id,n:i.n,l:x.l||'',p:price(x),q:1});cartbar();sh(0)}};d();sh(1)}
function cartbar(){const n=cart.reduce((a,c)=>a+c.q,0);$('#ct').style.display=n?'block':'none';$('#cb').textContent=`🛒 السلة (${n}) • ${tot()} ج`}
$('#cb').onclick=()=>{$('#pn').innerHTML=`<h3>سلتك</h3><div id="cl"></div><input class="f" id="nm" placeholder="الاسم"><input class="f" id="ph" type="tel" placeholder="رقم التليفون">${mode=='d'?'<textarea class="f" id="dr" rows="2" placeholder="العنوان بالتفصيل"></textarea>':''}<textarea class="f" id="nt" rows="2" placeholder="ملاحظات (اختياري)"></textarea><button class="go" id="sd">تأكيد الطلب</button>`;lst();sh(1)};
function lst(){$('#cl').innerHTML=cart.map((c,j)=>`<div class="r"><span>${esc(c.n)} ${esc(c.l)}<br><small>${c.p*c.q} ج</small></span><span><button data-j="${j}" data-d="1">+</button> ${c.q} <button data-j="${j}" data-d="-1">−</button></span></div>`).join('')+`<p style="margin:10px 0">المجموع: <b>${tot()} ج</b>${fee()?` + توصيل ${fee()} ج = <b>${tot()+fee()} ج</b>`:''}</p>`}
$('#pn').onclick=e=>{const b=e.target;if(b.dataset.d){const c=cart[b.dataset.j];c.q+=+b.dataset.d;if(c.q<1)cart.splice(b.dataset.j,1);cartbar();cart.length?lst():sh(0)}if(b.id=='sd')send();if(b.id=='ok')sh(0)};
async function send(){const g=s=>($d(s)?.value||'').trim(),nm=g('#nm'),ph=g('#ph'),dr=g('#dr');
 if(nm.length<2||!/^[0-9+\s]{8,15}$/.test(ph)||(mode=='d'&&dr.length<5))return alert('كمّل بياناتك: الاسم والتليفون'+(mode=='d'?' والعنوان':''));
 $('#sd').disabled=1;try{const r=await db.collection('orders').add({mode,name:nm,phone:ph,addr:dr,note:g('#nt'),items:cart.map(({n,l,p,q})=>({n,l,p,q})),sub:tot(),fee:fee(),total:tot()+fee(),st:'new',ts:firebase.firestore.FieldValue.serverTimestamp()});
 cart=[];cartbar();$('#pn').innerHTML=`<h3>✅ تم استلام طلبك</h3><p style="margin-top:8px">رقم الطلب: ${r.id.slice(0,5).toUpperCase()}<br>هنكلمك على ${esc(ph)} للتأكيد.</p><button class="go" id="ok">تمام</button>`}
 catch(e){alert('حصلت مشكلة، حاول تاني أو كلمنا على واتساب');$('#sd').disabled=0}}
</script></body></html>
