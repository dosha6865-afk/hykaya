<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>شاشة المطبخ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#1e0a29;color:#fff;font-family:Cairo,Tahoma,sans-serif;padding:10px;max-width:1100px;margin:auto}
button{font:700 14px Cairo,sans-serif;cursor:pointer}label{color:#d9c3e6;font-size:13px}small{color:#d9c3e6}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#1e0a29;padding:8px 0;z-index:5}
.fl{display:flex;gap:6px}.fl button{border:0;border-radius:10px;padding:8px 14px;background:#4a2262;color:#d9c3e6}.fl .on{background:#7ab51d;color:#1b2a05}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:10px}
.c{background:#2e1340;border-radius:16px;padding:14px;border-top:5px solid #7ab51d}.c.n{border-color:#f59e0b;animation:p 1.2s infinite alternate}
@keyframes p{to{box-shadow:0 0 0 3px #f59e0b66}}
.h{display:flex;justify-content:space-between;align-items:center}.h b{font-size:19px}
ul{list-style:none;margin:10px 0}li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #fff2}
.act{display:flex;gap:8px;margin-top:10px}.act button{flex:1;border:0;border-radius:12px;padding:10px;background:#f59e0b;color:#1b1000}.act .ok{background:#7ab51d;color:#16260a}
.e{text-align:center;padding:60px;color:#d9c3e6}#pr{display:none}
</style></head><body>
<div id="gate" class="e">جاري الدخول...</div>
<div id="app" hidden><div class="top"><div class="fl" id="fl"></div><label><input type="checkbox" id="ap"> طباعة تلقائية للطلب الجديد</label><label><input type="checkbox" id="sd" checked> صوت</label></div><div class="g" id="g"></div></div>
<div id="pr"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyBVo7lZD7wA0ZiyonjFDJ02oI7vtFL6PL8",authDomain:"hekayah-2b746.firebaseapp.com",projectId:"hekayah-2b746",appId:"1:835699402304:web:fc3ec2a7b09fe3029f61a5"};
firebase.initializeApp(FB);const db=firebase.firestore();
const DEF={fb:"https://www.facebook.com/share/1YafafjWqT/",ig:"https://www.instagram.com/hekaya_koshary?srtk=MWN4N2J3a2N5eHhkbw==",wa:"201103008038",fee:10,km:5,
br:[{n:"فرع ميدان الساعة",u:"https://maps.app.goo.gl/3YRHpijEeg6H73Rc9?g_st=ac",la:31.2437686,lo:29.9845781},{n:"فرع 45",u:"https://maps.app.goo.gl/XGmzqW8zqPxJu1M2A?g_st=ac",la:31.262968,lo:30.007603}]};
</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),A=firebase.auth();
const MD={s:'🍽️ الصالة',t:'🛍️ تيك أواي',d:'🛵 توصيل'};
let orders=[],S=DEF,f=localStorage.kf||'s',first=1;
const AUSER='ADMIN',APASS='Kokodd2016#',AMAIL=AUSER.toLowerCase()+'@hekaya.app';
A.signInWithEmailAndPassword(AMAIL,APASS).catch(()=>A.createUserWithEmailAndPassword(AMAIL,APASS)).catch(()=>{$('#gate').textContent='تعذر الدخول، تأكد من تفعيل Email/Password في Firebase'});
A.onAuthStateChanged(u=>{$('#gate').hidden=!!u;$('#app').hidden=!u;if(u)start()});
$('#ap').checked=localStorage.ka=='1';$('#ap').onchange=()=>localStorage.ka=$('#ap').checked?1:0;
const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(()=>o.stop(),600)}catch(e){}};
const tm=o=>o.ts?.toDate?o.ts.toDate().toLocaleString('ar-EG'):'';
let started=0;
function start(){if(started)return;started=1;db.doc('settings/main').get().then(d=>{S={...DEF,...(d.data()||{})}}).catch(()=>{});
 db.collection('orders').orderBy('ts','desc').limit(80).onSnapshot(s=>{const nw=[];
  s.docChanges().forEach(c=>{if(c.type=='added'&&!first&&(f=='all'||c.doc.data().mode==f))nw.push(c.doc.id)});
  orders=s.docs.map(d=>({id:d.id,...d.data()}));first=0;show();
  if(nw.length){if($('#sd').checked)beep();if($('#ap').checked)nw.forEach(id=>print(id))}})}
function show(){$('#fl').innerHTML=[['s','🍽️ الصالة'],['t','🛍️ تيك أواي'],['d','🛵 توصيل'],['all','الكل']].map(([k,v])=>`<button data-f="${k}" class="${k==f?'on':''}">${v}</button>`).join('');
 $('#g').innerHTML=orders.filter(o=>f=='all'||o.mode==f).map(o=>`<div class="c ${o.st=='new'?'n':''}"><div class="h"><b>${o.mode=='s'?'طاولة '+esc(o.tb||''):MD[o.mode]}</b><small>#${o.id.slice(0,5).toUpperCase()}</small></div><small>${tm(o)}</small>
${o.mode!='s'?`<br><small>👤 ${esc(o.name)} • 📞 ${esc(o.phone)}${o.addr?'<br>📍 '+esc(o.addr):''}</small>`:''}
<ul>${o.items.map(i=>`<li><span>${i.q}× ${esc(i.n)} ${esc(i.l)}</span><span>${i.p*i.q}</span></li>`).join('')}</ul>${o.note?`<small>📝 ${esc(o.note)}</small><br>`:''}<b>الإجمالي: ${o.total} ج</b>
<div class="act"><button data-p="${o.id}">🖨️ طباعة</button><button class="ok" data-d="${o.id}">✅ تم</button></div></div>`).join('')||'<p class="e">مفيش طلبات</p>'}

// دالة الطباعة المحسنة عبر iframe مخفي لتجاوز مشاكل المتصفح
function print(id){
    const o=orders.find(x=>x.id==id);if(!o)return;
    const d=o.ts?.toDate?.()||new Date(),wa=S.wa?'0'+String(S.wa).replace(/^20/,''):'';
    
    // بناء كود الفاتورة بتنسيق حراري سليم 80mm
    const htmlContent = `
        <html dir="rtl"><head><meta charset="utf-8"><title>طباعة طلب</title>
        <style>
            body{background:#fff;color:#000;padding:0;margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;width:72mm}
            .r{text-align:center}
            .r img{width:38mm;filter:grayscale(1) contrast(1.3)}
            .r h2{font-size:21px;margin:1.5mm 0}
            .r .ln{border-top:2px dashed #000;margin:2.5mm 0}
            .r .row{display:flex;justify-content:space-between;font-size:14px;padding:.6mm 0;text-align:start}
            .r .big{font-size:18px;font-weight:900}
            .r .tb{font-size:26px;font-weight:900;border:3px solid #000;border-radius:3mm;padding:1mm 4mm;display:inline-block;margin:1mm 0}
            .r small{color:#000;font-size:12px}
        </style></head><body>
        <div class="r">
            ${S.logo?`<img src="${esc(S.logo)}" alt="">`:''}
            <h2>كشري حكاية</h2>
            <div>${d.toLocaleDateString('ar-EG')} • ${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>
            <div class="ln"></div>
            ${o.mode=='s'?`<div class="tb">طاولة ${esc(o.tb||'')}</div>`:`<div class="big">${MD[o.mode]}</div>`}
            <div>طلب #${o.id.slice(0,5).toUpperCase()}</div>
            <div class="ln"></div>
            ${o.items.map(i=>`<div class="row"><span>${i.q}× ${esc(i.n)} ${esc(i.l)}</span><b>${i.p*i.q}</b></div>`).join('')}
            <div class="ln"></div>
            ${o.fee?`<div class="row"><span>التوصيل</span><b>${o.fee}</b></div>`:''}
            <div class="row big"><span>الإجمالي</span><span>${o.total} ج</span></div>
            ${o.mode!='s'?`<div class="ln"></div><div class="row"><span>${esc(o.name)}</span><span>${esc(o.phone)}</span></div>${o.addr?`<div style="text-align:start">📍 ${esc(o.addr)}</div>`:''}`:''}
            ${o.note?`<div class="ln"></div><div style="text-align:start">📝 ${esc(o.note)}</div>`:''}
            <div class="ln"></div>
            <div>شكراً لزيارتكم ❤️</div>
            ${wa?`<small>للطلب: ${wa}</small>`:''}
        </div></body></html>
    `;

    // إنشاء عنصر iframe خفي لإرسال أمر الطباعة مباشرة بدلاً من نافذة المتصفح الرئيسية
    let iframe = document.createElement('iframe');
    iframe.style.position = 'absolute';
    iframe.style.width = '0px';
    iframe.style.height = '0px';
    iframe.style.border = 'none';
    document.body.appendChild(iframe);

    let doc = iframe.contentWindow.document;
    doc.open();
    doc.write(htmlContent);
    doc.close();

    setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        // إزالة الإطار المخفي بعد انتهاء الطباعة
        setTimeout(() => { document.body.removeChild(iframe); }, 1000);
    }, 300);

    if(o.st=='new') db.doc('orders/'+id).update({st:'prep'}).catch(()=>{});
}

document.onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.f){f=b.dataset.f;localStorage.kf=f;show()}
 if(b.dataset.p)print(b.dataset.p);
 if(b.dataset.d&&confirm('الطلب هيتمسح من السجل نهائيًا. متأكد؟'))db.doc('orders/'+b.dataset.d).delete()};
</script></body></html>
