<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>شاشة المطبخ - كشري حكاية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{background:#1e0a29;color:#fff;font-family:Cairo,Tahoma,sans-serif;padding:10px;max-width:1100px;margin:auto}
button{font:700 14px Cairo,sans-serif;cursor:pointer}
label{color:#d9c3e6;font-size:13px}
small{color:#d9c3e6}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#1e0a29;padding:8px 0;z-index:5}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl button{border:0;border-radius:10px;padding:8px 14px;background:#4a2262;color:#d9c3e6}
.fl .on{background:#7ab51d;color:#1b2a05}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:10px}
.c{background:#2e1340;border-radius:16px;padding:14px;border-top:5px solid #7ab51d}
.c.n{border-color:#f59e0b;animation:p 1.2s infinite alternate}
@keyframes p{to{box-shadow:0 0 0 3px #f59e0b66}}
.h{display:flex;justify-content:space-between;align-items:center}
.h b{font-size:19px}
ul{list-style:none;margin:10px 0}
li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed #fff2}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;border:0;border-radius:12px;padding:10px;background:#f59e0b;color:#1b1000}
.act .ok{background:#7ab51d;color:#16260a}
.e{text-align:center;padding:60px;color:#d9c3e6}
#pr{display:none}
</style>
</head>
<body>
<div id="gate" class="e">جاري الدخول...</div>
<div id="app" hidden>
  <div class="top">
    <div class="fl" id="fl"></div>
    <label><input type="checkbox" id="ap"> طباعة تلقائية للطلب الجديد</label>
    <label><input type="checkbox" id="sd" checked> صوت</label>
  </div>
  <div class="g" id="g"></div>
</div>
<div id="pr"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/*
  تنبيه أمني:
  لا تضع كلمة مرور مدير ثابتة داخل ملف HTML منشور.
  غيّر كلمة المرور التي سبق استخدامها، واستخدم حساباً مخصصاً للطباعة
  بصلاحيات Firestore محدودة. ضع بيانات الحساب الجديدة هنا مؤقتاً فقط
  إذا كنت تختبر محلياً؛ الأفضل نقل تسجيل الدخول إلى خادم آمن.
*/
const FB = {
  apiKey: "AIzaSyBVo7lZD7wA0ZiyonjFDJ02oI7vtFL6PL8",
  authDomain: "hekayah-2b746.firebaseapp.com",
  projectId: "hekayah-2b746",
  appId: "1:835699402304:web:fc3ec2a7b09fe3029f61a5"
};

firebase.initializeApp(FB);
const db = firebase.firestore();
const A = firebase.auth();

/* أدخل بيانات حساب الطباعة الجديد بعد تغيير كلمة المرور القديمة */
const PRINT_USER = "admin@hekaya.app";
const PRINT_PASSWORD = "PUT_NEW_PASSWORD_HERE";

const DEF = {
  fb: "https://www.facebook.com/share/1YafafjWqT/",
  ig: "https://www.instagram.com/hekaya_koshary/",
  wa: "201103008038",
  fee: 10,
  km: 5,
  br: [
    {n:"فرع ميدان الساعة",u:"https://maps.app.goo.gl/3YRHpijEeg6H73Rc9?g_st=ac",la:31.2437686,lo:29.9845781},
    {n:"فرع 45",u:"https://maps.app.goo.gl/XGmzqW8zqPxJu1M2A?g_st=ac",la:31.262968,lo:30.007603}
  ]
};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'
}[c]));

const MD = {s:'🍽️ الصالة',t:'🛍️ تيك أواي',d:'🛵 توصيل'};
let orders = [];
let S = DEF;
let f = localStorage.kf || 's';
let first = 1;
let started = 0;
let unsubscribeOrders = null;
let printingQueue = Promise.resolve();

$('#ap').checked = localStorage.ka === '1';
$('#ap').onchange = () => {
  localStorage.ka = $('#ap').checked ? '1' : '0';
};

const beep = () => {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator();
    o.connect(c.destination);
    o.start();
    setTimeout(() => {
      o.stop();
      c.close();
    }, 600);
  } catch(e) {}
};

const tm = o => o.ts?.toDate
  ? o.ts.toDate().toLocaleString('ar-EG')
  : '';

A.signInWithEmailAndPassword(PRINT_USER, PRINT_PASSWORD)
  .catch(() => {
    $('#gate').textContent =
      'تعذر الدخول. راجع حساب الطباعة وكلمة المرور وإعداد Email/Password في Firebase.';
  });

A.onAuthStateChanged(u => {
  $('#gate').hidden = !!u;
  $('#app').hidden = !u;
  if (u) start();
});

function start() {
  if (started) return;
  started = 1;

  db.doc('settings/main').get()
    .then(d => { S = {...DEF, ...(d.data() || {})}; })
    .catch(() => { S = DEF; });

  unsubscribeOrders = db.collection('orders')
    .orderBy('ts','desc')
    .limit(80)
    .onSnapshot(snapshot => {
      const newIds = [];

      snapshot.docChanges().forEach(change => {
        if (change.type === 'added' && !first) {
          const order = change.doc.data();
          if (f === 'all' || order.mode === f) {
            newIds.push(change.doc.id);
          }
        }
      });

      orders = snapshot.docs.map(d => ({id:d.id,...d.data()}));
      first = 0;
      show();

      if (newIds.length) {
        if ($('#sd').checked) beep();
        if ($('#ap').checked) {
          newIds.forEach(id => {
            printingQueue = printingQueue.then(() => print(id));
          });
        }
      }
    }, error => {
      $('#gate').hidden = false;
      $('#gate').textContent = 'تعذر تحميل الطلبات: ' + error.message;
    });
}

function show() {
  $('#fl').innerHTML = [
    ['s','🍽️ الصالة'],
    ['t','🛍️ تيك أواي'],
    ['d','🛵 توصيل'],
    ['all','الكل']
  ].map(([k,v]) =>
    `<button data-f="${k}" class="${k===f?'on':''}">${v}</button>`
  ).join('');

  $('#g').innerHTML = orders
    .filter(o => f === 'all' || o.mode === f)
    .map(o => `
      <div class="c ${o.st === 'new' ? 'n' : ''}">
        <div class="h">
          <b>${o.mode === 's' ? 'طاولة '+esc(o.tb || '') : (MD[o.mode] || 'طلب')}</b>
          <small>#${o.id.slice(0,5).toUpperCase()}</small>
        </div>
        <small>${tm(o)}</small>
        ${o.mode !== 's' ? `
          <br><small>👤 ${esc(o.name)} • 📞 ${esc(o.phone)}
          ${o.addr ? '<br>📍 '+esc(o.addr) : ''}</small>
        ` : ''}
        <ul>
          ${(o.items || []).map(i => `
            <li>
              <span>${esc(i.q)}× ${esc(i.n)} ${esc(i.l || '')}</span>
              <span>${Number(i.p || 0) * Number(i.q || 0)}</span>
            </li>
          `).join('')}
        </ul>
        ${o.note ? `<small>📝 ${esc(o.note)}</small><br>` : ''}
        <b>الإجمالي: ${esc(o.total)} ج</b>
        <div class="act">
          <button data-p="${o.id}">🖨️ طباعة</button>
          <button class="ok" data-d="${o.id}">✅ تم</button>
        </div>
      </div>
    `).join('') || '<p class="e">مفيش طلبات</p>';
}

/* تجهيز HTML مستقل لكل إيصال */
function makePrintDocument(content, includeLogo = false) {
  return `<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>إيصال</title>
    <style>
      @page { size: 80mm auto; margin: 0; }
      * { box-sizing: border-box; }
      html, body {
        width: 80mm;
        margin: 0;
        padding: 0;
        background: #fff;
        color: #000;
        font-family: Tahoma, Arial, sans-serif;
        font-size: 11px;
        line-height: 1.35;
      }
      body { padding: 2mm 3mm; }
      .center { text-align: center; }
      .bold { font-weight: 900; }
      .title { font-size: 15px; font-weight: 900; }
      .dash { border-top: 1px dashed #000; margin: 2mm 0; }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 2mm;
        padding: 1mm 0;
      }
      .item span { overflow-wrap: anywhere; }
      .item b { white-space: nowrap; }
      .note { overflow-wrap: anywhere; }
      .qr { width: 22mm; height: 22mm; object-fit: contain; }
      img { max-width: 100%; }
      .end { margin-top: 2mm; }
    </style>
  </head>
  <body>${content}</body>
  </html>`;
}

/*
  طباعة مهمة واحدة في iframe.
  عند انتهاء نافذة الطباعة يتم حذف iframe ثم تشغيل المهمة التالية.
  القص الفعلي يعتمد على تفعيل Auto Cut في تعريف SPRT على Windows.
*/
function printOneDocument(html) {
  return new Promise(resolve => {
    const frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden','true');
    frame.style.position = 'fixed';
    frame.style.left = '-10000px';
    frame.style.top = '0';
    frame.style.width = '80mm';
    frame.style.height = '20mm';
    frame.style.border = '0';
    document.body.appendChild(frame);

    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(html);
    doc.close();

    const cleanup = () => {
      setTimeout(() => {
        frame.remove();
        resolve();
      }, 300);
    };

    const images = Array.from(doc.images);
    Promise.all(images.map(img => {
      if (img.complete) return Promise.resolve();
      return new Promise(done => {
        img.onload = done;
        img.onerror = done;
      });
    })).then(() => {
      const win = frame.contentWindow;
      let finished = false;

      const finish = () => {
        if (finished) return;
        finished = true;
        cleanup();
      };

      win.onafterprint = finish;

      try {
        win.focus();
        win.print();
        /* احتياط لبعض المتصفحات التي لا تطلق afterprint */
        setTimeout(() => {
          if (!finished) {
            /* لا نغلق نافذة الطباعة بالقوة؛ afterprint هو الأساس */
          }
        }, 60000);
      } catch (err) {
        console.error('Print error:', err);
        finish();
      }
    });
  });
}

async function print(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;

  const d = o.ts?.toDate?.() || new Date();
  const mode = o.mode === 's'
    ? `طاولة ${esc(o.tb || '')}`
    : (MD[o.mode] || 'طلب');

  const kitchenItems = (o.items || []).map(i => `
    <div class="item bold">
      <span>${esc(i.q)} × ${esc(i.n)} ${esc(i.l || '')}</span>
    </div>
  `).join('');

  const kitchen = makePrintDocument(`
    <div class="center">
      <div class="title">كشري حكاية</div>
      <div class="bold">إيصال المطبخ</div>
      <div class="bold">${mode}</div>
      <div>طلب #${id.slice(0,5).toUpperCase()}</div>
      <div>${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="dash"></div>
    ${kitchenItems}
    ${o.note ? `
      <div class="dash"></div>
      <div class="note bold">ملاحظات الطلب:</div>
      <div class="note">${esc(o.note)}</div>
    ` : ''}
    <div class="dash"></div>
    <div class="center end">نهاية إيصال المطبخ</div>
  `);

  const customerItems = (o.items || []).map(i => `
    <div class="item">
      <span>${esc(i.q)} × ${esc(i.n)} ${esc(i.l || '')}</span>
      <b>${Number(i.p || 0) * Number(i.q || 0)} ج</b>
    </div>
  `).join('');

  const customer = makePrintDocument(`
    <div class="center">
      ${S.logo ? `<img src="${esc(S.logo)}" style="width:20mm;max-height:20mm;object-fit:contain">` : ''}
      <div class="title">كشري حكاية</div>
      <div>${d.toLocaleDateString('ar-EG')} • ${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>
    <div class="dash"></div>
    <div class="center bold">${mode}</div>
    <div class="center">طلب #${id.slice(0,5).toUpperCase()}</div>
    <div class="dash"></div>
    ${customerItems}
    <div class="dash"></div>
    ${o.fee ? `
      <div class="item"><span>التوصيل</span><b>${esc(o.fee)} ج</b></div>
    ` : ''}
    <div class="item bold" style="font-size:14px">
      <span>الإجمالي</span><b>${esc(o.total)} جنيه</b>
    </div>
    ${o.mode !== 's' ? `
      <div class="dash"></div>
      <div><b>العميل:</b> ${esc(o.name)}</div>
      <div><b>الهاتف:</b> ${esc(o.phone)}</div>
      ${o.addr ? `<div><b>العنوان:</b> ${esc(o.addr)}</div>` : ''}
    ` : ''}
    <div class="dash"></div>
    <div class="center">
      شكراً لزيارتكم ❤️
      <div><img class="qr" src="https://i.ibb.co/3yk63fW/qr-koshary.png" alt="QR"></div>
      <small>امسح الكود لطلباتك وزيارتنا</small>
    </div>
  `);

  try {
    /* مهمتان منفصلتان: المطبخ أولاً ثم العميل */
    await printOneDocument(kitchen);
    await printOneDocument(customer);

    if (o.st === 'new') {
      await db.doc('orders/' + id).update({st:'prep'});
    }
  } catch (err) {
    console.error(err);
    alert('حصل خطأ أثناء الطباعة. راجع الطابعة والاتصال.');
  }
}

/* أزرار الفلاتر والطباعة وإنهاء الطلب */
document.onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;

  if (b.dataset.f) {
    f = b.dataset.f;
    localStorage.kf = f;
    show();
  }

  if (b.dataset.p) {
    printingQueue = printingQueue.then(() => print(b.dataset.p));
  }

  if (b.dataset.d) {
    if (confirm('الطلب هيتمسح من السجل نهائياً. متأكد؟')) {
      db.doc('orders/' + b.dataset.d).delete()
        .catch(err => alert('تعذر حذف الطلب: ' + err.message));
    }
  }
};

window.addEventListener('beforeunload', () => {
  if (unsubscribeOrders) unsubscribeOrders();
});
</script>
</body>
</html>
